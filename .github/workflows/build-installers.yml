name: Build Installers

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ej: 1.0.0)'
        required: true
        default: '1.0.0'

env:
  APP_NAME: SmartFileOrganizer
  MAIN_CLASS: com.smartfileorganizer.Main

jobs:

  build-windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar Inno Setup
        run: choco install innosetup --yes --no-progress
        shell: pwsh

      - name: Calcular version
        id: ver
        run: |
          $raw = "${{ github.event.inputs.version || github.ref_name }}"
          $v   = $raw.TrimStart('v')
          echo "version=$v" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Empaquetar backend
        run: |
          cd backend
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q
          pip install pyinstaller -q
          pyinstaller --onefile `
            --name sfo-backend `
            --distpath "../dist/win/backend" `
            --hidden-import=uvicorn.logging `
            --hidden-import=uvicorn.loops `
            --hidden-import=uvicorn.loops.auto `
            --hidden-import=uvicorn.protocols `
            --hidden-import=uvicorn.protocols.http `
            --hidden-import=uvicorn.protocols.http.auto `
            --hidden-import=uvicorn.protocols.websockets `
            --hidden-import=uvicorn.protocols.websockets.auto `
            --hidden-import=uvicorn.lifespan `
            --hidden-import=uvicorn.lifespan.on `
            --hidden-import=anyio._backends._asyncio `
            --hidden-import=anyio._backends._trio `
            --hidden-import=multiprocessing `
            --hidden-import=sqlite3 `
            --collect-all fastapi `
            --collect-all pydantic `
            --collect-all uvicorn `
            --collect-all starlette `
            --collect-all sqlalchemy `
            --noconfirm `
            main.py
        shell: pwsh

      - name: Compilar frontend
        run: |
          cd frontend
          mvn clean package -DskipTests -q

      - name: Empaquetar frontend con jpackage
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          jpackage `
            --type app-image `
            --name "${{ env.APP_NAME }}" `
            --app-version $v `
            --input frontend/target `
            --dest dist/win/frontend `
            --main-jar frontend-1.0.0.jar `
            --main-class "${{ env.MAIN_CLASS }}" `
            --java-options "--enable-preview" `
            --java-options "-Xmx512m" `
            --java-options "--add-opens=javafx.graphics/com.sun.javafx.application=ALL-UNNAMED"
        shell: pwsh

      - name: Crear launcher
        run: |
          $appDir = "dist/win/frontend/${{ env.APP_NAME }}"
          New-Item -ItemType Directory -Force "$appDir/backend" | Out-Null
          Copy-Item "dist/win/backend/sfo-backend.exe" "$appDir/backend/" -Force
          & packaging/scripts/create_launcher.ps1 -AppDir $appDir
        shell: pwsh

      - name: Generar instalador
        run: |
          $v    = "${{ steps.ver.outputs.version }}"
          $root = (Get-Location).Path
          & packaging/scripts/create_installer.ps1 -Version $v -Root $root -AppName "${{ env.APP_NAME }}"
        shell: pwsh

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/${{ env.APP_NAME }}-*-setup.exe
          retention-days: 7

  build-macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar create-dmg
        run: brew install create-dmg

      - name: Calcular version
        id: ver
        run: |
          raw="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${raw#v}" >> $GITHUB_OUTPUT

      - name: Empaquetar backend
        run: |
          cd backend
          pip install --upgrade pip -q
          pip install -r requirements.txt -q
          pip install pyinstaller -q
          pyinstaller --onefile \
            --name sfo-backend \
            --distpath "../dist/mac/backend" \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols \
            --hidden-import=uvicorn.protocols.http \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=uvicorn.protocols.websockets \
            --hidden-import=uvicorn.protocols.websockets.auto \
            --hidden-import=uvicorn.lifespan \
            --hidden-import=uvicorn.lifespan.on \
            --hidden-import=anyio._backends._asyncio \
            --hidden-import=anyio._backends._trio \
            --hidden-import=multiprocessing \
            --hidden-import=sqlite3 \
            --collect-all fastapi \
            --collect-all pydantic \
            --collect-all uvicorn \
            --collect-all starlette \
            --collect-all sqlalchemy \
            --noconfirm \
            main.py

      - name: Compilar frontend
        run: |
          cd frontend
          mvn clean package -DskipTests -q

      - name: Empaquetar con jpackage
        run: |
          V="${{ steps.ver.outputs.version }}"
          jpackage \
            --type app-image \
            --name "${{ env.APP_NAME }}" \
            --app-version "$V" \
            --input frontend/target \
            --dest dist/mac/frontend \
            --main-jar frontend-1.0.0.jar \
            --main-class "${{ env.MAIN_CLASS }}" \
            --java-options "--enable-preview" \
            --java-options "-Xmx512m" \
            --java-options "--add-opens=javafx.graphics/com.sun.javafx.application=ALL-UNNAMED" \
            --mac-package-identifier com.smartfileorganizer.app \
            --mac-package-name "Smart File Organizer"

      - name: Crear launcher
        run: |
          BUNDLE="dist/mac/frontend/${{ env.APP_NAME }}.app"
          mkdir -p "$BUNDLE/Contents/MacOS/backend"
          cp dist/mac/backend/sfo-backend "$BUNDLE/Contents/MacOS/backend/"
          chmod +x "$BUNDLE/Contents/MacOS/backend/sfo-backend"
          mv "$BUNDLE/Contents/MacOS/${{ env.APP_NAME }}" "$BUNDLE/Contents/MacOS/${{ env.APP_NAME }}-ui"
          bash packaging/scripts/create_mac_launcher.sh "$BUNDLE" "${{ env.APP_NAME }}"
          xattr -cr "$BUNDLE" 2>/dev/null || true

      - name: Crear DMG
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dist/installer
          create-dmg \
            --volname "Smart File Organizer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "${{ env.APP_NAME }}.app" 150 185 \
            --hide-extension "${{ env.APP_NAME }}.app" \
            --app-drop-link 450 185 \
            --no-internet-enable \
            "dist/installer/${{ env.APP_NAME }}-${V}.dmg" \
            "dist/mac/frontend/"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/installer/${{ env.APP_NAME }}-*.dmg
          retention-days: 7

  build-linux:
    name: Linux (.AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fuse libfuse2 libgtk-3-0 libxss1 libnss3 libasound2 \
            libglib2.0-0 libdbus-1-3 curl

      - name: Descargar appimagetool
        run: |
          curl -Lo /usr/local/bin/appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /usr/local/bin/appimagetool

      - name: Calcular version
        id: ver
        run: |
          raw="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${raw#v}" >> $GITHUB_OUTPUT

      - name: Empaquetar backend
        run: |
          cd backend
          pip install --upgrade pip -q
          pip install -r requirements.txt -q
          pip install pyinstaller -q
          pyinstaller --onefile \
            --name sfo-backend \
            --distpath "../dist/linux/backend" \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols \
            --hidden-import=uvicorn.protocols.http \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=uvicorn.protocols.websockets \
            --hidden-import=uvicorn.protocols.websockets.auto \
            --hidden-import=uvicorn.lifespan \
            --hidden-import=uvicorn.lifespan.on \
            --hidden-import=anyio._backends._asyncio \
            --hidden-import=anyio._backends._trio \
            --hidden-import=multiprocessing \
            --hidden-import=sqlite3 \
            --collect-all fastapi \
            --collect-all pydantic \
            --collect-all uvicorn \
            --collect-all starlette \
            --collect-all sqlalchemy \
            --noconfirm \
            main.py

      - name: Compilar frontend
        run: |
          cd frontend
          mvn clean package -DskipTests -q

      - name: Empaquetar con jpackage
        run: |
          V="${{ steps.ver.outputs.version }}"
          jpackage \
            --type app-image \
            --name "${{ env.APP_NAME }}" \
            --app-version "$V" \
            --input frontend/target \
            --dest dist/linux/frontend \
            --main-jar frontend-1.0.0.jar \
            --main-class "${{ env.MAIN_CLASS }}" \
            --java-options "--enable-preview" \
            --java-options "-Xmx512m" \
            --java-options "--add-opens=javafx.graphics/com.sun.javafx.application=ALL-UNNAMED"

      - name: Construir AppDir
        run: |
          APPDIR="dist/linux/AppDir"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -r "dist/linux/frontend/${{ env.APP_NAME }}" "$APPDIR/frontend"
          mkdir -p "$APPDIR/backend"
          cp dist/linux/backend/sfo-backend "$APPDIR/backend/"
          chmod +x "$APPDIR/backend/sfo-backend"
          python3 packaging/scripts/gen_icon.py "$APPDIR/usr/share/icons/hicolor/256x256/apps/smartfileorganizer.png"
          cp "$APPDIR/usr/share/icons/hicolor/256x256/apps/smartfileorganizer.png" "$APPDIR/smartfileorganizer.png"
          bash packaging/scripts/create_appdir.sh "$APPDIR" "${{ env.APP_NAME }}"

      - name: Generar AppImage
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dist/installer
          ARCH=x86_64 appimagetool \
            dist/linux/AppDir \
            "dist/installer/${{ env.APP_NAME }}-${V}-x86_64.AppImage"
          chmod +x dist/installer/*.AppImage

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: dist/installer/${{ env.APP_NAME }}-*-x86_64.AppImage
          retention-days: 7

  create-release:
    name: Crear Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Smart File Organizer ${{ github.ref_name }}
          body: |
            ## Smart File Organizer ${{ github.ref_name }}

            | Sistema | Archivo | Notas |
            |---------|---------|-------|
            | Windows 10/11 | `SmartFileOrganizer-*-setup.exe` | Doble clic para instalar |
            | macOS 12+ | `SmartFileOrganizer-*.dmg` | Arrastra a Applications |
            | Linux x86_64 | `SmartFileOrganizer-*-x86_64.AppImage` | chmod +x y ejecutar |

            > No requiere Java ni Python instalado.
          draft: false
          prerelease: false
          files: artifacts/*
          generate_release_notes: true