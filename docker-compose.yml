services:

  redis:
    image: redis:7-alpine
    container_name: sfo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    container_name: python_dev
    build: ./backend
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /:/host:ro
      - /:/host_rw
    env_file:
      - .env
    environment:
      - HOST_ROOT=/host
      - HOST_ROOT_RW=/host_rw
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080
      # FIX: guardar SQLite en /tmp para evitar "readonly database" en Docker
      # Desktop con Windows, donde el volumen montado tiene permisos restrictivos.
      # /tmp siempre es escribible dentro del contenedor.
      - DB_PATH=/tmp/smart_file_organizer.db
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    container_name: java_dev
    build: ./frontend
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
    depends_on:
      backend:
        condition: service_healthy
    command: tail -f /dev/null

