services:
  backend:
    container_name: python_dev
    build: ./backend
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Montar directorios del host para escaneo
      - C:\:/host/c  # Acceso completo a disco C:
      - D:\:/host/d  # Acceso completo a disco D:
      - C:\Users:/host/users  # Mantener compatibilidad con rutas existentes
      - D:\Data:/host/data     # Mantener compatibilidad con rutas existentes
      - /host/scans:/app/scans   # Directorio de trabajo para escaneos
    environment:
      - HOST_ROOT=/host
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    container_name: java_dev
    build: ./frontend
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
    command: tail -f /dev/null