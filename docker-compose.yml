services:
  backend:
    container_name: python_dev
    build: ./backend
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Montar todo el sistema de archivos del host como solo lectura
      - /:/host:ro
    environment:
      - HOST_ROOT=/host
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    container_name: java_dev
    build: ./frontend
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
    command: tail -f /dev/null

# FOR DEVELOPMENT ONLY - end users run build-*.sh or build-win.bat